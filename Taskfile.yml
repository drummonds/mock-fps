version: '3'

tasks:
  build:
    desc: Build the mock-fps server binary
    cmds:
      - go build -o bin/mock-fps ./cmd/server

  run:
    desc: Build and run the server
    deps: [build]
    cmds:
      - ./bin/mock-fps

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race ./...

  check:
    desc: Run fmt, vet, test and clean
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: clean

  docs:build:
    desc: Build documentation HTML
    cmds:
      - task-plus md2html --file index.md --dst docs
      - task-plus md2html --file docs/fps-events.md --dst docs
      - task-plus md2html --file docs/states.md --dst docs

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
